# serial-boards.conf — board labels and discovery tuning for serial-connect
# Installed to: ~/.config/serial-boards.conf
#
# ── Board labels ───────────────────────────────────────────────────────────────
#
# Maps USB serial number to a board label, with optional baud rate override.
#
# Format:  SERIAL=LABEL
#          SERIAL=LABEL:BAUD
#
# The serial number is stable across reboots and USB re-enumeration.
# Find it with: serial-discover  (shown in the Board column for unlabelled ports)
# Or auto-generate labels from board hostnames: serial-agent auto-label -y
#
# Examples:
# 46241800161=AM62D2-EVM
# 45241640028=AM62P-EVM:115200
#
# ── Discovery tuning ───────────────────────────────────────────────────────────
#
# PROBE_BAUDS — ordered baud rates to try during discovery (comma-separated).
# Per-board baud overrides are always elevated to position 0 automatically.
# M and K suffixes are supported (1.5M, 115.2K, etc.).
# Default: 115.2K,9600,19200,38400,57600,230.4K,460.8K,921.6K,1.5M
#
#PROBE_BAUDS=115.2K,9600,19200,38400,57600,230.4K,460.8K,921.6K,1.5M

# PROBE_PARALLEL — max simultaneous port probes (0 = unlimited).
# Cap if you have many ports and see USB bus contention.  Default: 0
#
#PROBE_PARALLEL=8

# PROBE_READ_MS — ms to wait for a board response per baud attempt.
# Main speed knob: halving this halves worst-case discovery time.
# Lower values may miss slow-responding boards.  Default: 100
#
#PROBE_READ_MS=50

# PROBE_DRAIN_MS — ms to drain stale tty bytes after each baud switch.
# Prevents false-positive baud detection from buffered residue.  Default: 10
#
#PROBE_DRAIN_MS=10

# ── Hardware chip descriptors ──────────────────────────────────────────────────
#
# Override or extend the built-in chip table by USB VID:PID.
# Format:  VID:PID=CHIP_NAME
#          VID:PID=CHIP_NAME:BAUD
#
# Built-in chips: FTDI (FT232/FT2232/FT4232), XDS110, RPiProbe,
#                 CP210x/CP2105/CP2108, CH340/CH343P, PL2303
#
#0403:6011=FT4232H:115200
#10c4:ea60=CP210x:115200
