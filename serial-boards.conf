PROBE_READ_MS=100
PROBE_DRAIN_MS=10

# Board labels — SERIAL=NAME  or  SERIAL=NAME:BAUD
# Find serial numbers with: serial-discover
# Auto-generate from board hostnames: serial-agent auto-label -y
