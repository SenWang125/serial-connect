# Chip table  (add custom chips or override defaults below)
0403:6001=FT232RL
0403:6010=FT2232H
0403:6011=FT4232H
0403:6014=FT232H
0403:6015=FT231X
0451:bef3=XDS110
0451:bef4=XDS110
2e8a:000c=RPiProbe
10c4:ea60=CP210x
10c4:ea70=CP2105
10c4:ea71=CP2108
067b:2303=PL2303
1a86:7523=CH340
1a86:55d4=CH343P

# Discovery settings
PROBE_BAUDS=115200,9600,19200,38400,57600,230400,460800,921600,1500000
