# serial-boards.conf
# Edit this file to label your boards and tune discovery behaviour.
# ─────────────────────────────────────────────────────────────────────────────

# ── Board labels ──────────────────────────────────────────────────────────────
# SERIAL=LABEL  or  SERIAL=LABEL:BAUD
# The USB serial number is stable across reboots and re-enumeration.
# Find it with: serial-discover  (Board column of unlabelled ports)
# Auto-generate from board hostnames: serial-agent auto-label -y
#
# 46241800161=AM62D2-EVM
# 45241640028=AM62P-EVM:115200

# ── Chip table overrides ───────────────────────────────────────────────────────
# VID:PID=CHIP_NAME  or  VID:PID=CHIP_NAME:BAUD
# Extends or overrides the built-in chip table (FTDI, XDS110, CP210x, CH340…).
#
# 0403:6011=FT4232H:115200
# abcd:1234=MyCustomChip

# ── Discovery tuning ──────────────────────────────────────────────────────────
# Uncomment and adjust any of these to change discovery behaviour.
#
# Baud scan order (per-board overrides are always tried first):
#PROBE_BAUDS=115.2K,9600,19200,38400,57600,230.4K,460.8K,921.6K,1.5M
#
# Max simultaneous port probes — cap if USB bus gets congested (0 = unlimited):
#PROBE_PARALLEL=8
#
# Response wait per baud attempt in ms — the main speed knob (default 100):
#PROBE_READ_MS=50
#
# Drain window after baud switch in ms — prevents false baud detection (default 10):
#PROBE_DRAIN_MS=10
