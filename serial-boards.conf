# serial-boards.conf
# User configuration for serial-connect tools.
# ─────────────────────────────────────────────────────────────────────────────

# ── Board labels ──────────────────────────────────────────────────────────────
# SERIAL=LABEL  or  SERIAL=LABEL:BAUD
# Find serial numbers with: serial-discover
# Auto-generate labels from board hostnames: serial-agent auto-label -y
#
# 46241800161=AM62D2-EVM
# 45241640028=AM62P-EVM:115200

# ── Probe tuning (optional) ────────────────────────────────────────────────────
# Uncomment to override defaults. Defaults shown.
#
#PROBE_BAUDS=115200,9600,19200,38400,57600,230400,460800,921600,1500000
#PROBE_PARALLEL=0
#PROBE_READ_MS=100
#PROBE_DRAIN_MS=10

# ── Custom or unlisted chips (optional) ───────────────────────────────────────
# VID:PID=CHIP_NAME  or  VID:PID=CHIP_NAME:BAUD
#
#abcd:1234=MyChip:115200
