# serial-boards.conf — single source of truth for serial-connect tools
# Edit this file. All settings here are active defaults.
# ─────────────────────────────────────────────────────────────────────────────

# ── Chip table ────────────────────────────────────────────────────────────────
# VID:PID=CHIP_NAME  or  VID:PID=CHIP_NAME:BAUD
# Add unlisted chips or override names/bauds below the built-ins.
0403:6001=FT232RL
0403:6010=FT2232H
0403:6011=FT4232H
0403:6014=FT232H
0403:6015=FT231X
0451:bef3=XDS110
0451:bef4=XDS110
2e8a:000c=RPiProbe
10c4:ea60=CP210x
10c4:ea70=CP2105
10c4:ea71=CP2108
067b:2303=PL2303
1a86:7523=CH340
1a86:55d4=CH343P

# ── Discovery tuning ──────────────────────────────────────────────────────────
# Baud scan order — per-board overrides are always tried first.
PROBE_BAUDS=115.2K,9600,19200,38400,57600,230.4K,460.8K,921.6K,1.5M
# Max simultaneous port probes (0 = unlimited):
PROBE_PARALLEL=0
# Ms to wait for board response per baud attempt (main speed knob):
PROBE_READ_MS=100
# Ms to drain stale tty bytes after each baud switch:
PROBE_DRAIN_MS=10

# ── Board labels ──────────────────────────────────────────────────────────────
# SERIAL=LABEL  or  SERIAL=LABEL:BAUD
# Find serial numbers with: serial-discover
# Auto-generate from board hostnames: serial-agent auto-label -y
#
# 46241800161=AM62D2-EVM
# 45241640028=AM62P-EVM:115200
