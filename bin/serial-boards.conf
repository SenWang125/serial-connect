# serial-boards.conf — configuration for serial-connect tools
# ─────────────────────────────────────────────────────────────────────────────

# Chip table
# Maps USB VID:PID to a display name. Add unlisted chips or rename existing ones.
# Format: VID:PID=NAME  or  VID:PID=NAME:BAUD  (override default baud for that chip)
0403:6001=FT232RL
0403:6010=FT2232H
0403:6011=FT4232H
0403:6014=FT232H
0403:6015=FT231X
0451:bef3=XDS110
0451:bef4=XDS110
2e8a:000c=RPiProbe
10c4:ea60=CP210x
10c4:ea70=CP2105
10c4:ea71=CP2108
067b:2303=PL2303
1a86:7523=CH340
1a86:55d4=CH343P

# Discovery settings
# PROBE_BAUDS    Ordered list of baud rates to try during port discovery.
#                The first match wins. Put your most common rate first.
PROBE_BAUDS=115200,9600,19200,38400,57600,230400,460800,921600,1500000
#
# PROBE_PARALLEL Max number of ports probed at the same time.
#                0 = unlimited (all ports in parallel). Lower if USB bus saturates.
PROBE_PARALLEL=0
#
# PROBE_READ_MS  How long to wait (ms) for a board response at each baud rate.
#                The main speed knob — halving this halves worst-case probe time.
#                Too low and slow-to-respond boards appear dead.
PROBE_READ_MS=100
#
# PROBE_DRAIN_MS How long to drain stale bytes (ms) after switching baud rate.
#                Prevents reading leftover data from a prior baud as a false hit.
PROBE_DRAIN_MS=10

# Board labels
# Maps USB adapter serial number to a human-readable board name.
# The serial number is stable across reboots and USB re-enumeration.
# Format: SERIAL=NAME  or  SERIAL=NAME:BAUD  (pin a specific baud for this board)
#
# Find serial numbers:         serial-discover
# Auto-generate from hostnames: serial-agent auto-label -y
#
# 46241800161=AM62D2-EVM
# 45241640028=AM62P-EVM:115200
