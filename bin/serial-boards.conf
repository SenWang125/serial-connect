# serial-boards.conf — configuration for serial-connect tools
# ─────────────────────────────────────────────────────────────────────────────

# ── Discovery settings ───────────────────────────────────────────────────────
#
#   PROBE_BAUDS     Ordered baud rates tried per port. First match wins.
#   PROBE_PARALLEL  Max ports probed simultaneously (0 = up to nproc).
#   PROBE_READ_MS   Wait time per baud attempt in ms. Lower = faster discovery,
#                   but boards that take longer to respond may appear dead.
#   PROBE_DRAIN_MS  Drain window after each baud switch. Prevents leftover bytes
#                   from a prior baud being mistaken for a valid response.
#
PROBE_BAUDS=115200,9600,19200,38400,57600,230400,460800,921600,1500000
PROBE_PARALLEL=0
PROBE_READ_MS=100
PROBE_DRAIN_MS=10

# ── Board labels ──────────────────────────────────────────────────────────────
#
#   Maps the USB adapter serial number to a human-readable board name.
#   The serial number is stable across reboots and USB re-enumeration.
#
#   Format:   SERIAL=NAME          (baud auto-detected by chip type)
#             SERIAL=NAME:BAUD     (pin a specific baud for this board)
#
#   Find serial numbers:            serial-discover
#   Auto-generate from hostnames:   serial-agent auto-label -y
#
#   Examples:
#     46241800161 = BeaglePlay
#     A9B3C2D1E0 = BeagleBone-Black:115200
#     0001 = OrangePi5Plus:1500000
#     abcdef01 = RPi4B

# ── TI EVM labels ─────────────────────────────────────────────────────────────
# Two AM62D2 EVMs exist. Both report hostname "am62dxx-evm" — A/B suffix
# is the only distinguisher. Add AM62D2-EVM-B serial once that unit is reconnected.
46241800161=AM62D-EVM
# ???????????=AM62D2-EVM-B
45241640028=AM62P5-EVM
# 50251350197=AM62A7-EVM

