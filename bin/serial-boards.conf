# serial-boards.conf — configuration for serial-connect tools
# ─────────────────────────────────────────────────────────────────────────────

# Discovery settings
PROBE_BAUDS=115200,9600,19200,38400,57600,230400,460800,921600,1500000
PROBE_PARALLEL=0    # max simultaneous port probes (0 = unlimited)
PROBE_READ_MS=100   # ms per baud attempt — lower = faster, may miss slow boards
PROBE_DRAIN_MS=10   # ms to drain stale tty bytes after baud switch — prevents false baud detection

# Board labels — SERIAL=NAME  or  SERIAL=NAME:BAUD
# Find serial numbers with: serial-discover
# Auto-generate from board hostnames: serial-agent auto-label -y

# ─────────────────────────────────────────────────────────────────────────────
# Chip table — VID:PID = NAME  or  VID:PID = NAME:BAUD
# VID:xxxx = NAME  matches any unlisted PID from that vendor (wildcard)
# ─────────────────────────────────────────────────────────────────────────────

