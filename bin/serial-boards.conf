# serial-boards.conf — configuration for serial-connect tools
# ─────────────────────────────────────────────────────────────────────────────

# Chip table
# Maps USB VID:PID to a display name. Add unlisted chips or rename existing ones.
# Format: VID:PID=NAME  or  VID:PID=NAME:BAUD
#
# FTDI
0403:6001=FT232RL
0403:6010=FT2232H
0403:6011=FT4232H
0403:6014=FT232H
0403:6015=FT231X
0403:6035=FT230X
#
# Silicon Labs CP210x
10c4:ea60=CP2102
10c4:ea61=CP210x
10c4:ea70=CP2105
10c4:ea71=CP2108
10c4:ea72=CP2102N
10c4:ea7e=CP2102N
#
# WCH CH340 / CH341 / CH343
1a86:7523=CH340
1a86:7522=CH340B
1a86:55d4=CH343P
1a86:5523=CH341A
1a86:e00d=CH9102
#
# Prolific PL2303
067b:2303=PL2303
067b:23a3=PL2303HXD
067b:2304=PL2303X
#
# Texas Instruments XDS110  (AM62x, AM64x, CC13xx, CC26xx)
0451:bef3=XDS110
0451:bef4=XDS110
#
# Raspberry Pi
2e8a:000c=RPiProbe
2e8a:0004=RPiPico
#
# STMicroelectronics ST-LINK / STM32 VCP
0483:374b=STLink-V2
0483:374e=STLink-V3
0483:5740=STM32-VCP
#
# NXP / Arm DAPLink  (FRDM, LPCXpresso, mbed boards)
0d28:0204=DAPLink
#
# Espressif ESP32 USB CDC  (S2, S3, C3, C6, H2)
303a:0002=ESP32-S2
303a:1001=ESP32-S3
303a:8140=ESP32-C3
#
# Arduino  (Uno R3, Mega, Leonardo)
2341:0043=ArduinoUno
2341:0042=ArduinoMega
2341:8036=ArduinoLeo

# Discovery settings
PROBE_BAUDS=115200,9600,19200,38400,57600,230400,460800,921600,1500000
PROBE_PARALLEL=0
PROBE_READ_MS=100
PROBE_DRAIN_MS=10

# Board labels — SERIAL=NAME  or  SERIAL=NAME:BAUD
# Find serial numbers with: serial-discover
# Auto-generate from board hostnames: serial-agent auto-label -y
